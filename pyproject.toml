[project]
name = "pyresume"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "groq>=1.5.0",
    "pymupdf4llm>=1.28.0",
    "python-dotenv>=1.2.2",
    "textual>=8.2.8",
    "textual-dev>=1.8.0",
]

[project.scripts]
pyresume = "pyresume.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
